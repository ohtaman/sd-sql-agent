[project]
name = "sql-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ohtaman", email = "ohtamans@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "duckdb>=1.4.3",
    "pandas>=2.3.3",
    "pydantic>=2.0.0",
    "google-adk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
eval-bird = "sql_agent.eval.eval_bird:evaluate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
